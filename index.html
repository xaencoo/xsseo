<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Xsseo">
<meta name="theme-color" content="#0d0920">
<meta name="description" content="Xsseo — музыкальный плеер с визуализатором, плейлистами и добавлением треков по ссылкам">
<meta property="og:title" content="Xsseo">
<meta property="og:description" content="Музыкальный плеер с визуализатором. Слушай свои файлы и треки по ссылкам.">
<meta property="og:type" content="website">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Xsseo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<style>
@property --h1{syntax:'<number>';inherits:true;initial-value:265}
@property --h2{syntax:'<number>';inherits:true;initial-value:330}
:root{color-scheme:dark;--bg:#0d0920;--fg:#f4f0ff;--muted:#a79fc9;--card:rgba(255,255,255,.06);--line:rgba(255,255,255,.12);--bass:0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);transition:--h1 1.4s,--h2 1.4s}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0d0920;--fg:#f4f0ff;--muted:#a79fc9;--card:rgba(255,255,255,.06);--line:rgba(255,255,255,.12)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){color-scheme:light;--bg:#f2eeff;--fg:#1b1238;--muted:#675c92;--card:rgba(255,255,255,.65);--line:rgba(60,40,120,.16)}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:Manrope,system-ui,sans-serif;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,li:focus-visible{outline:2px solid hsl(var(--h2) 95% 70%);outline-offset:3px;border-radius:12px}

.bg{position:fixed;inset:0;z-index:-1;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;transform:scale(calc(1 + var(--bass)*.3));transition:transform .12s}
.b1{width:60vmax;height:60vmax;left:-20vmax;top:-15vmax;background:hsl(var(--h1) 90% 55%);animation:f1 18s ease-in-out infinite alternate}
.b2{width:50vmax;height:50vmax;right:-18vmax;top:25vh;background:hsl(var(--h2) 90% 58%);animation:f2 22s ease-in-out infinite alternate}
.b3{width:40vmax;height:40vmax;left:15vw;bottom:-22vmax;background:hsl(calc(var(--h1) + 40) 90% 55%);animation:f1 26s ease-in-out infinite alternate-reverse}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .blob{opacity:.35}}
@keyframes f1{to{translate:12vw 10vh}}
@keyframes f2{to{translate:-14vw -12vh}}

.app{max-width:560px;margin:0 auto;padding:18px 20px 210px}
.logo{font-family:Unbounded,system-ui,sans-serif;font-weight:700;font-size:26px;letter-spacing:-.02em;background:linear-gradient(90deg,hsl(var(--h1) 95% 70%),hsl(var(--h2) 95% 70%));-webkit-background-clip:text;background-clip:text;color:transparent;display:inline-block;animation:logo 1.4s cubic-bezier(.2,.8,.2,1) both}
@keyframes logo{from{letter-spacing:.35em;opacity:0;filter:blur(8px)}}
.grid{margin-top:10px}
#v-home,#v-lib,#v-add{display:none}
body[data-tab="home"] #v-home{display:flex}
body[data-tab="lib"] #v-lib,body[data-tab="add"] #v-add{display:block;animation:swap .4s both}
li[hidden]{display:none}
.chips,.tools{display:flex;gap:8px;flex-wrap:wrap}
.chips{margin:0 8px 8px}
.tools{justify-content:center;margin-top:16px}
.chip{padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:700;color:var(--muted);transition:color .2s,background .2s,transform .15s}
.chip:active{transform:scale(.95)}
.chip.on{color:#fff;border-color:transparent;background:linear-gradient(135deg,hsl(var(--h1) 95% 62%),hsl(var(--h2) 95% 60%))}
li.fav b::after{content:" ♥";color:hsl(var(--h2) 95% 65%)}
.x{margin-left:6px}
.srch{display:block;width:calc(100% - 16px);height:44px;margin:4px 8px 8px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--fg);padding:0 14px;font:inherit;font-size:14px}
.file{display:block;margin:8px;padding:26px 16px;border-radius:20px;border:1.5px dashed var(--line);text-align:center;cursor:pointer;transition:border-color .2s,background .2s}
.file:hover{border-color:hsl(var(--h2) 95% 65%);background:var(--card)}
.file span{display:block;font-weight:700;font-size:16px}
.file small{display:block;margin-top:6px;color:var(--muted);font-weight:600}
.note{margin:10px 14px 0;font-size:13px;color:var(--muted)}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 12px calc(10px + env(safe-area-inset-bottom,0px));pointer-events:none}
.dock>*{pointer-events:auto;width:100%;max-width:536px}
.mini-p{display:none;align-items:center;gap:12px;padding:8px 10px;border-radius:20px;background:var(--card);border:1px solid var(--line);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);cursor:pointer;animation:swap .4s both}
body:not([data-tab="home"]) .mini-p{display:flex}
.mini-p .mc{width:42px;height:42px;border-radius:12px;flex:none}
.mini-p .mt{flex:1;min-width:0}
.mini-p b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.mini-p small{color:var(--muted);font-weight:600;font-size:12px}
.mini-p .i-pause,.playing .mini-p .i-play{display:none}
.playing .mini-p .i-pause{display:block}
.nav{display:flex;gap:4px;padding:6px;border-radius:24px;background:var(--card);border:1px solid var(--line);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px)}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;border-radius:18px;font-size:12px;font-weight:700;color:var(--muted);transition:color .2s,background .2s}
.nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
body[data-tab="home"] #t-home,body[data-tab="lib"] #t-lib,body[data-tab="add"] #t-add{color:var(--fg);background:linear-gradient(135deg,hsl(var(--h1) 90% 60% / .35),hsl(var(--h2) 90% 60% / .2))}

.player{display:flex;flex-direction:column;align-items:center}
.stage{position:relative;width:min(70vw,340px);aspect-ratio:1;margin:46px 0 40px;will-change:transform}
#viz{position:absolute;left:-20%;top:-20%;width:140%;height:140%;pointer-events:none}
.disc{position:absolute;inset:14%;border-radius:50%;
background:conic-gradient(from 0deg,hsl(var(--h1) 90% 62%),hsl(var(--h2) 90% 60%),hsl(var(--h1) 80% 28%),hsl(var(--h2) 90% 60%),hsl(var(--h1) 90% 62%));
box-shadow:0 20px 60px hsl(var(--h1) 90% 50% / .5),inset 0 0 0 2px rgba(255,255,255,.18);animation:spin 8s linear infinite;animation-play-state:paused}
.playing .disc{animation-play-state:running}
.disc::before{content:"";position:absolute;inset:0;border-radius:50%;background:repeating-radial-gradient(rgba(0,0,0,.2) 0 1px,transparent 1px 4px),linear-gradient(115deg,transparent 30%,rgba(255,255,255,.28) 45%,transparent 60%)}
.disc::after{content:"X";position:absolute;inset:34%;border-radius:50%;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:700 clamp(18px,6vw,30px) Unbounded,sans-serif;box-shadow:0 0 0 4px rgba(255,255,255,.2)}
@keyframes spin{to{transform:rotate(360deg)}}

.meta{width:100%;max-width:420px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.meta h1{margin:0;font:700 clamp(21px,5.5vw,28px)/1.15 Unbounded,sans-serif;letter-spacing:-.02em}
.meta p{margin:6px 0 0;color:var(--muted);font-weight:600}
.swap{animation:swap .55s cubic-bezier(.2,.8,.2,1)}
@keyframes swap{from{opacity:0;transform:translateY(10px);filter:blur(6px)}}
.like{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);flex:none;transition:background .2s}
.like svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2}
.like.on{color:hsl(var(--h2) 95% 65%)}
.like.on svg{fill:currentColor;animation:pop .45s cubic-bezier(.3,1.8,.5,1)}
@keyframes pop{0%{transform:scale(.5)}100%{transform:scale(1)}}

.seek{width:100%;max-width:420px;margin-top:18px}
.times{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:24px;background:transparent;cursor:pointer;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:9px;background:linear-gradient(90deg,hsl(var(--h1) 95% 65%),hsl(var(--h2) 95% 65%)) 0/var(--p,0%) 100% no-repeat,var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;margin-top:-5px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px hsl(var(--h2) 95% 65% / .4)}
input[type=range]::-moz-range-track{height:6px;border-radius:9px;background:var(--line)}
input[type=range]::-moz-range-progress{height:6px;border-radius:9px;background:linear-gradient(90deg,hsl(var(--h1) 95% 65%),hsl(var(--h2) 95% 65%))}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border:0;border-radius:50%;background:#fff;box-shadow:0 0 0 4px hsl(var(--h2) 95% 65% / .4)}

.ctrl{display:flex;align-items:center;justify-content:center;gap:clamp(10px,4vw,22px);margin-top:10px}
.ib{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:var(--muted);transition:color .2s,transform .15s,background .2s}
.ib:hover{color:var(--fg);background:var(--card)}
.ib:active{transform:scale(.88)}
.ib.on{color:hsl(var(--h2) 95% 68%)}
.ib svg{width:24px;height:24px;fill:currentColor}
.ib.stroke svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.play{position:relative;width:76px;height:76px;border-radius:50%;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,hsl(var(--h1) 95% 62%),hsl(var(--h2) 95% 60%));box-shadow:0 10px 34px hsl(var(--h2) 90% 55% / .55);transition:transform .15s}
.play:active{transform:scale(.92)}
.play svg{width:32px;height:32px;fill:currentColor}
.play::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid hsl(var(--h2) 95% 70%);opacity:0}
.playing .play::after{animation:ring 1.8s ease-out infinite}
@keyframes ring{from{opacity:.8;transform:scale(1)}to{opacity:0;transform:scale(1.7)}}
.play .i-pause,.playing .play .i-play{display:none}
.playing .play .i-pause{display:block}
.vol{display:flex;align-items:center;gap:10px;width:100%;max-width:220px;margin-top:14px;color:var(--muted)}
.vol svg{width:20px;height:20px;fill:currentColor;flex:none}

.list{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:10px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.list h2{margin:12px 12px 8px;font:600 15px Unbounded,sans-serif}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:center;gap:14px;padding:10px 12px;border-radius:18px;cursor:pointer;transition:background .2s,transform .2s}
li:hover{background:var(--card);transform:translateX(4px)}
li.act{background:linear-gradient(90deg,hsl(var(--h1) 90% 60% / .22),hsl(var(--h2) 90% 60% / .08))}
.mini{width:48px;height:48px;border-radius:14px;flex:none;position:relative;overflow:hidden}
.eq{position:absolute;inset:0;display:none;align-items:flex-end;justify-content:center;gap:3px;padding:10px;background:rgba(0,0,0,.35)}
li.act .eq{display:flex}
.eq i{width:4px;height:6px;border-radius:2px;background:#fff;animation:eq .9s ease-in-out infinite alternate;animation-play-state:paused}
.playing li.act .eq i{animation-play-state:running}
.eq i:nth-child(2){animation-delay:-.3s}.eq i:nth-child(3){animation-delay:-.6s}.eq i:nth-child(4){animation-delay:-.15s}
@keyframes eq{to{height:26px}}
li .t{flex:1;min-width:0}
li b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
li small{color:var(--muted);font-weight:600}
li time{color:var(--muted);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.add{display:flex;gap:8px;margin:10px 8px 6px}
.add input{flex:1;min-width:0;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--fg);padding:0 14px;font:inherit;font-size:14px}
.addb{padding:0 16px;border-radius:14px;font-weight:700;color:#fff;background:linear-gradient(135deg,hsl(var(--h1) 95% 62%),hsl(var(--h2) 95% 60%))}
.hint{margin:4px 14px 8px;font-size:13px;color:var(--muted);min-height:1em}
#embed{width:100%;max-width:420px;margin-top:18px;animation:swap .5s both}
#embed[hidden]{display:none}
#embed iframe{width:100%;border:0;border-radius:16px;display:block;color-scheme:normal}
#embed audio{width:100%}
#embed a{display:block;margin-top:8px;font-size:13px;color:var(--muted);font-weight:600}
.x{width:32px;height:32px;border-radius:50%;color:var(--muted)}
.x:hover{background:var(--card);color:var(--fg)}
@media (prefers-reduced-motion:reduce){.blob,.disc,.logo,.play::after,.eq i{animation:none!important}}
</style>
</head>
<body data-tab="home">
<div class="bg"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i></div>
<main class="app" id="app">
  <div class="logo">Xsseo</div>
  <div class="grid">
    <section class="player" id="v-home">
      <div class="stage" id="stage"><canvas id="viz"></canvas><div class="disc"></div></div>
      <div class="meta">
        <div><h1 id="title"></h1><p id="artist"></p></div>
        <button class="like" id="like" aria-label="В избранное"><svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 2.7 5 6 5c2.1 0 3.6 1.2 4.5 2.7h3C14.4 6.2 15.9 5 18 5c3.3 0 5.1 3.4 3.6 6.8C19.5 16.4 12 21 12 21z" transform="translate(0 -.5)"/></svg></button>
      </div>
      <div id="embed" hidden></div>
      <div class="seek">
        <input type="range" id="seek" min="0" max="1000" value="0" aria-label="Перемотка">
        <div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div>
      </div>
      <div class="ctrl">
        <button class="ib stroke" id="shuf" aria-label="Перемешать"><svg viewBox="0 0 24 24"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg></button>
        <button class="ib" id="prev" aria-label="Назад"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
        <button class="play" id="play" aria-label="Играть"><svg class="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg><svg class="i-pause" viewBox="0 0 24 24"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg></button>
        <button class="ib" id="next" aria-label="Вперёд"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
        <button class="ib stroke" id="rep" aria-label="Повтор"><svg viewBox="0 0 24 24"><path d="M17 2l4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 0 1-3 3H3"/></svg></button>
      </div>
      <div class="vol"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9zM16 8a5 5 0 0 1 0 8l-1.2-1.6a3 3 0 0 0 0-4.8z"/></svg><input type="range" id="vol" min="0" max="100" value="80" aria-label="Громкость"></div>
      <div class="tools"><button class="chip" id="eqb"></button><button class="chip" id="slb"></button></div>
    </section>
    <section class="list" id="v-lib"><h2>Библиотека</h2><input id="q" class="srch" type="search" placeholder="Поиск по трекам" aria-label="Поиск по трекам"><div class="chips"><button class="chip on" id="f-all">Все</button><button class="chip" id="f-fav">Избранное</button></div><ul id="pl"></ul></section>
    <section class="list" id="v-add"><h2>Добавить музыку</h2>
      <label class="file"><input type="file" id="files" accept="audio/*" multiple hidden><span>Выбрать файлы с устройства</span><small>MP3, M4A, WAV, OGG. Играют с визуализатором</small></label>
      <p class="note">Или вставь ссылку. Работают YouTube, SoundCloud, Spotify, Apple Music, Deezer, Яндекс Музыка, Mixcloud, прямые ссылки на аудио и радиопотоки (через встроенные плееры сервисов).</p>
      <form class="add" id="addf"><input id="addu" type="url" required placeholder="Ссылка SoundCloud, Spotify, YouTube или .mp3" aria-label="Ссылка на трек"><button class="addb">Добавить</button></form>
      <p class="hint" id="hint"></p></section>
  </div>
</main>
<div class="dock">
  <div class="mini-p" id="mp" role="button" tabindex="0" aria-label="Открыть плеер"><div class="mc" id="mpc"></div><div class="mt"><b id="mpt"></b><small id="mpa"></small></div><button class="ib" id="mpb" aria-label="Играть или пауза"><svg class="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg><svg class="i-pause" viewBox="0 0 24 24"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg></button></div>
  <nav class="nav" aria-label="Главное меню">
    <button id="t-home"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/></svg>Главная</button>
    <button id="t-lib"><svg viewBox="0 0 24 24"><path d="M9 18V5l11-2v13M9 18a3 3 0 1 1-6 0 3 3 0 0 1 6 0zM20 16a3 3 0 1 1-6 0 3 3 0 0 1 6 0z"/></svg>Библиотека</button>
    <button id="t-add"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Добавить</button>
  </nav>
</div>

<script>
const $=s=>document.querySelector(s);
const T=[
 {n:'Neon Drift',a:'Xsseo Lab',bpm:108,root:57,h:[265,330],bars:40,lead:'sawtooth',pad:'sawtooth',prog:[[0,3,7],[-4,0,3],[3,7,10],[-2,2,5]],arp:[0,1,2,4,2,1,3,5],dens:1,kp:[0,4,8,12],hat:1,snare:1,bp:[0,6,8,14],cut:2600},
 {n:'Glass Rain',a:'Mira Vale',bpm:84,root:62,h:[190,235],bars:36,lead:'sine',pad:'triangle',prog:[[0,3,7],[-4,0,3],[-2,2,5],[-5,-2,2]],arp:[0,2,1,4,3,5,4,2],dens:2,kp:[0,10],hat:0,snare:0,bp:[0,8],cut:1800},
 {n:'Afterglow',a:'Kito & Sol',bpm:124,root:52,h:[330,385],bars:44,lead:'square',pad:'sawtooth',prog:[[0,3,7],[-4,0,3],[3,7,10],[-2,2,5]],arp:[0,3,1,4,2,5,1,3],dens:1,kp:[0,4,8,12],hat:1,snare:1,bp:[2,3,6,10,11,14],cut:3400},
 {n:'Lunar Static',a:'Orbit Hex',bpm:96,root:60,h:[150,215],bars:36,lead:'triangle',pad:'sawtooth',prog:[[0,3,7],[-7,-4,0],[-4,0,3],[-5,-1,2]],arp:[0,2,4,2,1,3,5,3],dens:2,kp:[0,7,10],hat:1,snare:1,bp:[0,3,7,10],cut:2200}
];
const dur=k=>k.buf?k.buf.duration:k.bars*16*60/k.bpm/4;
const fmt=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
let ctx,master,an,bus,fx,noise,cur=0,step=0,nextT=0,playing=false,shuffle=false,repeat=0,vol=.8,timer=null,FAV=new Set((()=>{try{return JSON.parse(localStorage.getItem('xsseo-fav')||'[]')}catch(e){return[]}})()),lo,mid,hi;
const mtof=m=>440*2**((m-69)/12);

function initAudio(){
 ctx=new (window.AudioContext||window.webkitAudioContext)();

 }
